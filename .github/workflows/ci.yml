name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No lockfile and no npm cache on purpose. scripts/prepare-public-react-native.sh
      # deletes package-lock.json before the subtree split, because the private
      # lockfile resolves @build-context/paygate through a local file: path that
      # does not exist here. setup-node's cache and `npm ci` both hard-require a
      # lockfile, so this mirror has to install from the registry instead.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

# Releases are NOT automated. Publishing is done by hand from the monorepo — see
# sdks/RELEASING.md and scripts/release-sdk.sh.
#
# The release jobs that used to live here were removed on purpose. Every channel
# failed at some point on an expired or misconfigured credential — a CocoaPods
# trunk session that lapsed, a pub.dev token, an npm scope that rejects the
# token — and the failures were quiet: a tag would be created and the publish
# would fail after it, leaving the repo looking released when nothing had been.
# A human running one script and reading its output is slower and more honest.
#
# This build job stays: it is the signal that the mirrored source still compiles.
